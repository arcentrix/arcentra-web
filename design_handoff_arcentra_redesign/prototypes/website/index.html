<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcentra — Open-source control plane for CI/CD</title>
<link rel="icon" href="../../assets/favicon-32x32.png" sizes="32x32" />
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  /* Marketing site uses the dark theme by default. */
  html { background: var(--bg); }
  body { margin: 0; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .muted { color: var(--fg-muted); }
  .ok    { color: var(--accent-success); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="../_shared/primitives.jsx"></script>
<script type="text/babel" src="./Header.jsx"></script>
<script type="text/babel" src="./Footer.jsx"></script>
<script type="text/babel" src="./Hero.jsx"></script>
<script type="text/babel" src="./Sections.jsx"></script>
<script type="text/babel" src="./Architecture.jsx"></script>
<script type="text/babel" src="./ProductPreview.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  return (
    <div data-screen-label="Marketing site · home" style={{ minHeight: "100dvh", display: "flex", flexDirection: "column" }}>
      <Header />
      <main style={{ flex: 1 }}>
        <Hero />
        <ProductPreview />
        <CoreWorkflow />
        <Workloads />
        <WhyArcentra />
        <Architecture />
        <OpenSource />
        <BottomCta />
      </main>
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
